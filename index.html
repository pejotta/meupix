<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeuPIX — Encurtador de Chaves PIX Inteligente</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <nav class="nav-container">
            <div class="logo"><a href="/"><img src="/assets/meupix-carimbo-branco.png" alt="MeuPIX"/></a></div>
            <ul class="nav-links">
                <li><a href="#vantagens">Vantagens</a></li>
                <li><a href="#planos">Planos</a></li>
                <li id="header-actions">
                    <a href="/login.html" class="btn-login">Entrar</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Sua oferta a um clique de distância.</h1>
            <p>Transforme chaves PIX complexas em links curtos e fáceis de copiar.</p>
            
            <div class="generator-box">
                <div style="display: flex; gap: 10px; width: 100%;">
                    <input type="text" id="pix" placeholder="Cole sua chave PIX aqui..." style="flex: 1;">
                    <button onclick="criar()">Gerar Link Grátis</button>
                </div>

                <div id="container-resultado" style="display:none; margin-top: 20px; width: 100%;">
                    <div style="background: #111; border: 1px solid #00c896; padding: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center;">
                        <div style="text-align: left;">
                            <p style="color: #888; margin: 0; font-size: 14px;">Link gerado com sucesso!</p>
                            <a href="#" id="link-gerado" target="_blank" style="color: #00c896; font-weight: bold; font-size: 18px; text-decoration: none;">meupix.com/nome</a>
                        </div>
                        <button onclick="copiarLink()" style="background: #00c896; color: #000; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold;">Copiar</button>
                    </div>
                </div>
            </div>
            <small style="display: block; margin-top: 10px;">Visitantes podem gerar 1 link aleatório por vez.</small>
        </section>

        </main>

    <footer>
        <div class="footer-content">
             <div class="logo"><a href="/"><img src="/assets/meupix-carimbo-branco.png" alt="MeuPIX"/></a></div>
            <p>&copy; 2025 MeuPIX - Facilitando suas ofertas e pagamentos.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
