<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeuPIX - Recuperar Senha</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --primary: #00c896; --bg: #0b0b0b; --card: #161616; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        
        .auth-container { 
            width: 100%; max-width: 400px; padding: 40px; background: var(--card); 
            border-radius: 24px; border: 1px solid #222; text-align: center; box-sizing: border-box;
        }

        .logo-auth { height: 40px; margin-bottom: 20px; }
        h2 { margin-bottom: 10px; font-size: 22px; }
        p.subtitle { color: #888; margin-bottom: 30px; font-size: 14px; line-height: 1.5; }

        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: #aaa; font-size: 13px; }
        
        input { 
            width: 100%; padding: 14px; background: #000; border: 1px solid #333; 
            color: #fff; border-radius: 10px; box-sizing: border-box; outline: none;
        }
        input:focus { border-color: var(--primary); }

        .btn-primary { 
            width: 100%; padding: 15px; background: var(--primary); color: #000; 
            border: none; border-radius: 10px; font-weight: bold; cursor: pointer; 
            transition: 0.3s; font-size: 16px;
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); }

        .footer-link { margin-top: 25px; font-size: 14px; color: #666; }
        .footer-link a { color: var(--primary); text-decoration: none; }
    </style>
</head>
<body>

    <div class="auth-container">
        <a href="/"><img src="/assets/meupix-carimbo-branco.png" alt="MeuPIX" class="logo-auth"></a>
        <h2>Recuperar senha</h2>
        <p class="subtitle">Insira seu e-mail abaixo. Se você estiver no nosso Banco de Dados, enviaremos as instruções.</p>

        <form id="recoverForm" onsubmit="event.preventDefault(); recuperarSenha();">
            <div class="input-group">
                <label>E-mail de cadastro</label>
                <input type="email" id="emailRecover" placeholder="seu@email.com" required>
            </div>
            
            <button type="submit" class="btn-primary" id="btnRecover">Enviar Instruções</button>
        </form>

        <div class="footer-link">
            Lembrou a senha? <a href="login.html">Voltar para o Login</a>
        </div>
    </div>

    <script>
        async function recuperarSenha() {
            const email = document.getElementById('emailRecover').value;
            const btn = document.getElementById('btnRecover');
            
            btn.innerText = "Verificando...";
            btn.disabled = true;

            // Aqui entra a chamada para o seu Worker do Cloudflare futuramente
            console.log("Solicitando recuperação para:", email);

            // Simulação de envio para não te deixar na mão
            setTimeout(() => {
                alert("Se esse e-mail estiver cadastrado, você receberá um link de recuperação em instantes!");
                btn.innerText = "Enviar Instruções";
                btn.disabled = false;
            }, 1500);
        }
    </script>
</body>
</html>
