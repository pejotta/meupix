<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeuPIX - Criar Conta</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --primary: #00c896; --bg: #0b0b0b; --card: #161616; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        
        .auth-container { 
            width: 100%; max-width: 450px; padding: 40px; background: var(--card); 
            border-radius: 24px; border: 1px solid #222; text-align: center; box-sizing: border-box;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .logo-auth { height: 40px; margin-bottom: 20px; }
        h2 { margin-bottom: 10px; font-size: 24px; }
        p.subtitle { color: #888; margin-bottom: 30px; font-size: 14px; }

        .input-group { text-align: left; margin-bottom: 18px; }
        .input-group label { display: block; margin-bottom: 8px; color: #aaa; font-size: 13px; font-weight: 500; }
        
        input { 
            width: 100%; padding: 14px; background: #000; border: 1px solid #333; 
            color: #fff; border-radius: 10px; box-sizing: border-box; outline: none;
            transition: 0.3s; font-size: 15px;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(0, 200, 150, 0.2); }

        .btn-primary { 
            width: 100%; padding: 15px; background: var(--primary); color: #000; 
            border: none; border-radius: 10px; font-weight: bold; cursor: pointer; 
            transition: 0.3s; font-size: 16px; margin-top: 10px;
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 200, 150, 0.3); }

        .footer-link { margin-top: 25px; font-size: 14px; color: #666; }
        .footer-link a { color: var(--primary); text-decoration: none; font-weight: bold; }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="auth-container">
        <a href="/"><img src="/assets/meupix-carimbo-branco.png" alt="MeuPIX" class="logo-auth"></a>
        <h2>Comece agora</h2>
        <p class="subtitle">Crie sua conta gratuita e profissionalize seus recebimentos.</p>

        <form onsubmit="event.preventDefault(); cadastrar();">
            <div class="input-group">
                <label>Nome Completo</label>
                <input type="text" id="nome" placeholder="Como quer ser chamado?" required>
            </div>
            
            <div class="input-group">
                <label>E-mail Corporativo ou Pessoal</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>
            
            <div class="input-group">
                <label>Senha de Acesso</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>
            </div>
            
            <div class="input-group">
                <label>Confirme sua Senha</label>
                <input type="password" id="confirmPassword" placeholder="Repita a senha" required>
            </div>
            
            <button type="submit" class="btn-primary">Criar Minha Conta</button>
        </form>

        <div class="footer-link">
            Já tem uma conta? <a href="login.html">Fazer Login</a>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
