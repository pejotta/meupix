<form onsubmit="event.preventDefault(); cadastrar();">
    <div class="input-group">
        <label>Nome Completo</label>
        <input type="text" id="nome" placeholder="Como quer ser chamado?" required>
    </div>
    <div class="input-group">
        <label>E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" required>
    </div>
    <div class="input-group">
        <label>Senha</label>
        <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>
    </div>
    <div class="input-group">
        <label>Confirme a Senha</label>
        <input type="password" id="confirmPassword" placeholder="Repita a senha" required>
    </div>
    
    <button type="submit" class="btn-primary">Criar Minha Conta</button>
    <p>Já tem conta? <a href="/login.html">Fazer Login</a></p>
</form>

<script src="app.js"></script>
