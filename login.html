<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>MeuPIX - Entrar ou Criar Conta</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container { max-width: 400px; margin: 100px auto; padding: 40px; background: #161616; border-radius: 20px; border: 1px solid #222; text-align: center; }
        .social-btns { display: flex; flex-direction: column; gap: 10px; margin-bottom: 25px; }
        .btn-google { background: #fff; color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .divider { margin: 20px 0; color: #555; display: flex; align-items: center; gap: 10px; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #333; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box; }
        .btn-primary { width: 100%; padding: 12px; background: #00c896; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .switch-auth { margin-top: 20px; font-size: 14px; color: #888; }
        .switch-auth a { color: #00c896; text-decoration: none; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2 id="auth-title">Bem-vindo de volta</h2>
        <p style="color: #888; margin-bottom: 30px;">Gerencie seus links PIX de forma profissional.</p>

        <form onsubmit="autenticar(event, isLogin ? 'login' : 'register')">
    <input name="email" type="email" placeholder="Seu e-mail" required>
    <input name="password" type="password" placeholder="Sua senha" required>
    <button type="submit">Entrar</button>
</form>

        <div class="switch-auth">
            <span id="switch-text">Não tem uma conta?</span> 
            <a href="#" id="toggle-auth">Cadastre-se</a>
        </div>
    </div>

    <script>
        const toggle = document.getElementById('toggle-auth');
        const title = document.getElementById('auth-title');
        const btnText = document.getElementById('btn-text');
        const switchText = document.getElementById('switch-text');
        let isLogin = true;

        toggle.onclick = (e) => {
            e.preventDefault();
            isLogin = !isLogin;
            title.innerText = isLogin ? 'Bem-vindo de volta' : 'Crie sua conta';
            btnText.innerText = isLogin ? 'Entrar' : 'Começar Agora';
            switchText.innerText = isLogin ? 'Não tem uma conta?' : 'Já possui conta?';
            toggle.innerText = isLogin ? 'Cadastre-se' : 'Entrar';
        };
    </script>
    <script src="app.js"></script>
</body>
</html>
