<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada - MeuPIX</title>
    <link rel="stylesheet" href="style.css"> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Estilos específicos para a página 404 */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #0b0b0b; /* Cor de fundo do seu site */
            color: #fff;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .error-container {
            max-width: 600px;
            width: 100%;
            background: #161616;
            border: 1px solid #222;
            border-radius: 24px;
            padding: 50px 30px;
        }

        .error-container img.logo {
            height: 60px; /* Logo um pouco maior */
            margin-bottom: 30px;
        }

        .error-container h1 {
            font-size: 80px;
            color: #00c896; /* Verde do MeuPIX */
            margin: 0;
            line-height: 1;
        }

        .error-container h2 {
            font-size: 28px;
            margin-top: 15px;
            margin-bottom: 20px;
            color: #fff;
        }

        .error-container p {
            font-size: 18px;
            color: #888;
            margin-bottom: 40px;
        }

        .btn-home {
            background: #00c896; /* Verde do MeuPIX */
            color: #000;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none; /* Para parecer um botão */
            transition: background 0.2s ease;
        }

        .btn-home:hover {
            background: #00e0a5; /* Um verde um pouco mais claro no hover */
        }

        /* Adiciona um estilo para o footer, se existir */
        footer {
            margin-top: 50px;
            font-size: 14px;
            color: #444;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <a href="/"><img src="/assets/meupix-carimbo-branco.png" alt="MeuPIX" class="logo"></a>
        <h1>404</h1>
        <h2>Página Não Encontrada</h2>
        <p>Parece que você se perdeu no espaço digital. Não se preocupe, vamos te levar de volta para casa!</p>
        <a href="/" class="btn-home">Voltar para a Home</a>
    </div>

    <footer>
        <p>&copy; 2025 MeuPIX - Facilitando suas ofertas e pagamentos.</p>
    </footer>
</body>
</html>
