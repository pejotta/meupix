<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeuPIX - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --primary: #00c896; --bg: #0b0b0b; --card: #161616; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; }
        .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
        
        .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; position: relative;}
        .user-info { display: flex; align-items: center; gap: 15px; }
        .logo-dash { height: 40px; }
        .badge-free { background: #333; padding: 4px 10px; border-radius: 20px; font-size: 12px; color: #aaa; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: var(--card); padding: 25px; border-radius: 16px; border: 1px solid #222; position: relative; overflow: hidden; }
        .stat-card h3 { margin: 0; font-size: 14px; color: #888; text-transform: uppercase; }
        .stat-card .value { font-size: 32px; font-weight: bold; margin-top: 10px; display: block; }

        .locked { filter: blur(4px); pointer-events: none; user-select: none; }
        .lock-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; 
                         justify-content: center; align-items: center; background: rgba(0,0,0,0.4); z-index: 2; border-radius: 16px; }
        .lock-icon { font-size: 24px; margin-bottom: 10px; }
        .btn-upgrade-small { background: var(--primary); color: #000; padding: 6px 15px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 12px; }

        .links-section { background: var(--card); border-radius: 16px; border: 1px solid #222; padding: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; color: #555; border-bottom: 1px solid #222; }
        td { padding: 15px; border-bottom: 1px solid #222; }
        .btn-del { color: #ff4d4d; background: none; border: none; cursor: pointer; font-weight: bold; }

        /* Modal Estilizado */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); }
        .modal-content { background: #161616; margin: 10% auto; padding: 30px; border-radius: 20px; max-width: 500px; border: 1px solid #333; text-align: center; }
        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: #888; }
        .input-group input { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="container">
        <header class="dash-header">
            <div class="user-info">
                <div class="logo-dash"><a href="/"><img src="/assets/meupix-carimbo-branco.png" alt="MeuPIX"/></a></div>
                <span class="badge-free">Plano Free</span>
            </div>
            <div id="header-actions"></div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Cliques Totais</h3>
                <span class="value" id="totalClicks">0</span>
            </div>
            <div class="stat-card">
                <div class="lock-overlay">
                    <span class="lock-icon">🔒</span>
                    <a href="#" class="btn-upgrade-small">Liberar no PRO</a>
                </div>
                <div class="locked">
                    <h3>Origem Geográfica</h3>
                    <span class="value">São Paulo</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="lock-overlay">
                    <span class="lock-icon">🔒</span>
                    <a href="#" class="btn-upgrade-small">Liberar no PRO</a>
                </div>
                <div class="locked">
                    <h3>Dispositivos</h3>
                    <span class="value">Mobile 85%</span>
                </div>
            </div>
        </div>

        <div class="links-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>Seus Links PIX</h2>
                <button onclick="document.getElementById('modalNovoLink').style.display='block'" style="background:var(--primary); color:#000; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:bold;">+ Novo Link</button>
            </div>

            <div id="container-resultado" style="display:none; margin-bottom: 20px;">
                <div style="background: #111; border: 1px solid #00c896; padding: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <p style="color: #888; margin: 0; font-size: 14px;">Link gerado com sucesso!</p>
                        <a href="#" id="link-gerado" target="_blank" style="color: #00c896; font-weight: bold; font-size: 18px; text-decoration: none;">meupix.com/carregando...</a>
                    </div>
                    <button onclick="copiarLink()" style="background: #00c896; color: #000; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold;">Copiar</button>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Atalho (Slug)</th>
                        <th>Chave PIX</th>
                        <th>Cliques</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="linksBody"></tbody>
            </table>
        </div>
    </div>

    <div id="modalNovoLink" class="modal">
        <div class="modal-content">
            <h2 style="margin-top:0">Criar Novo Link</h2>
            <div class="input-group">
                <label>Sua Chave PIX</label>
                <input type="text" id="novoPix" placeholder="Ex: e-mail, CPF ou chave aleatória">
            </div>
            <div class="input-group">
                <label>Nome do Link (Opcional)</label>
                <input type="text" id="novoSlug" placeholder="Ex: oferta-especial">
            </div>
            <div style="display: flex; gap: 10px;">
                <button onclick="criarNovoLink()" style="flex:1; background:var(--primary); color:#000; border:none; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer;">Gerar Link</button>
                <button onclick="document.getElementById('modalNovoLink').style.display='none'" style="flex:1; background:#333; color:#fff; border:none; padding:12px; border-radius:8px; cursor:pointer;">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        window.onload = () => {
            verificarSessao();
            carregarMeusLinks();
        };

        // Função para o Modal funcionar
        async function criarNovoLink() {
            const pix = document.getElementById('novoPix').value;
            const slug = document.getElementById('novoSlug').value;
            
            if(!pix) return alert("Insira uma chave PIX!");
            
            // Chama a sua função do app.js
            await criarLinkNoServidor(pix, slug); 
            
            document.getElementById('modalNovoLink').style.display = 'none';
        }
    </script>
</body>
</html>
