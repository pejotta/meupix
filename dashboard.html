<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MeuPIX</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --primary: #00c896; --bg: #0b0b0b; --sidebar: #161616; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; display: flex; }

        /* --- SIDEBAR RESPONSIVA --- */
        .sidebar { 
            width: 260px; background: var(--sidebar); height: 100vh; 
            padding: 30px 20px; border-right: 1px solid #222;
            position: fixed; transition: 0.3s; z-index: 1000;
        }

        /* Esconde a sidebar no mobile por padrão */
        @media (max-width: 768px) {
            .sidebar { left: -100%; } /* Joga pra fora da tela esquerda */
            .sidebar.active { left: 0; } /* Traz de volta */
        }

        .logo { width: 130px; margin-bottom: 40px; }
        
        .nav-link { 
            display: flex; align-items: center; padding: 12px; 
            color: #888; text-decoration: none; border-radius: 10px; margin-bottom: 5px;
            transition: 0.2s;
        }
        .nav-link:hover, .nav-link.active { background: #222; color: var(--primary); }

        /* --- BOTÃO SANDUÍCHE (Só aparece no Mobile) --- */
        .mobile-header {
            display: none; width: 100%; background: var(--sidebar);
            padding: 15px 20px; border-bottom: 1px solid #222;
            justify-content: space-between; align-items: center;
            position: fixed; top: 0; z-index: 1100;
        }

        @media (max-width: 768px) {
            .mobile-header { display: flex; }
            .main-content { margin-left: 0 !important; padding-top: 80px !important; }
        }

        .menu-toggle {
            background: none; border: none; color: var(--primary);
            font-size: 24px; cursor: pointer;
        }

        /* --- CONTEÚDO PRINCIPAL --- */
        .main-content { flex: 1; margin-left: 260px; padding: 40px; transition: 0.3s; }

        .welcome-card { background: linear-gradient(135deg, #1e1e1e, #111); padding: 30px; border-radius: 20px; border: 1px solid #222; margin-bottom: 30px; }
        
        /* Overlay para fechar o menu ao clicar fora */
        .overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 900;
        }
        .overlay.active { display: block; }
    </style>
</head>
<body>

    <div class="mobile-header">
        <img src="/assets/meupix-carimbo-branco.png" alt="MeuPIX" style="height: 30px;">
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    </div>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <nav class="sidebar" id="sidebar">
        <img src="/assets/meupix-carimbo-branco.png" alt="MeuPIX" class="logo">
        
        <a href="#" class="nav-link active" onclick="showView('home')">🏠 Início</a>
        <a href="#" class="nav-link" onclick="showView('links')">🔗 Meus Links</a>
        <a href="#" class="nav-link" onclick="showView('perfil')">👤 Perfil</a>
        
        <div style="position: absolute; bottom: 30px; width: calc(100% - 40px);">
            <a href="#" class="nav-link" onclick="sair()" style="color: #ff4d4d;">🚪 Sair</a>
        </div>
    </nav>

    <main class="main-content">
        <div id="view-home" class="view">
            <div class="welcome-card">
                <h1 id="welcome-text">Bem-vindo, Pejotta!</h1>
                <p style="color: #888;">Seu ecossistema PIX está operando normalmente.</p>
            </div>
        </div>

        <div id="view-links" class="view" style="display:none;">
            <h2>Seus Links Gerados</h2>
            <div id="lista-links">
                </div>
        </div>
    </main>

    <script>
        // Lógica do Menu Sanduíche
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        // Troca de abas (Views)
        function showView(viewName) {
            document.querySelectorAll('.view').forEach(v => v.style.display = 'none');
            document.getElementById('view-' + viewName).style.display = 'block';
            
            // Fecha o menu no mobile após clicar em um link
            if (window.innerWidth <= 768) toggleMenu();
        }

        // Função de Sair (Pejotta, lembra de camuflar o login no app.js!)
        function sair() {
            localStorage.removeItem('meupix_token');
            localStorage.removeItem('meupix_user_name');
            window.location.href = 'login.html';
        }

        // Pegar nome do Banco de Dados
        window.onload = () => {
            const nome = localStorage.getItem('meupix_user_name') || 'Pejotta';
            document.getElementById('welcome-text').innerText = `Bem-vindo, ${nome.split(' ')[0]}!`;
        };
    </script>
    <script src="app.js"></script>
</body>
</html>
